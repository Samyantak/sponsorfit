[project]
name = "sponsorfit"
version = "0.1.0"
description = "AI sponsorship-placement portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0.14",
    "openai>=1.50",
    "protego>=0.7.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sponsorfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
